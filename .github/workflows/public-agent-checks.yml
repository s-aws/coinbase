name: Public Agent Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ownership:
    name: Ownership manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compile public agent tools
        run: python -m py_compile tools/check_ownership.py tools/classify_repo_files.py

      - name: Check pull request ownership coverage
        if: github.event_name == 'pull_request'
        run: python tools/check_ownership.py --base origin/${{ github.base_ref }}

      - name: Check pull request root clutter
        if: github.event_name == 'pull_request'
        run: >
          python tools/classify_repo_files.py
          --quiet
          --fail-category empty_artifact_candidate
          --fail-category root_historical_note
          --fail-category root_diagnostic_tool
          --fail-category root_test_candidate
          --fail-category experimental_ui_candidate
          --fail-category ui_fixture_or_export_candidate
          --fail-category root_runtime_output

      - name: Check push ownership coverage
        if: github.event_name == 'push'
        run: python tools/check_ownership.py --base ${{ github.event.before }}

      - name: Check push root clutter
        if: github.event_name == 'push'
        run: >
          python tools/classify_repo_files.py
          --quiet
          --fail-category empty_artifact_candidate
          --fail-category root_historical_note
          --fail-category root_diagnostic_tool
          --fail-category root_test_candidate
          --fail-category experimental_ui_candidate
          --fail-category ui_fixture_or_export_candidate
          --fail-category root_runtime_output
