name: Continuous Deployment

on:
  workflow_run:
    workflows: [Public Agent Checks]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coinbase-backend-cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-local:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COINBASE_BACKEND_DEPLOYMENT_TIER: local
      COINBASE_BACKEND_LOCAL_DEPLOY_ROOT: ${{ github.workspace }}/coinbase-local/backend
      DEPLOYMENT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOYMENT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Backend policy checks
        run: |
          python tools/check_ownership.py
          python tools/run_autonomous_work_queue_check.py --summary-only

      - name: Admin API OpenAPI freshness check
        run: python tools/generate_admin_api_openapi.py --check

      - name: Admin API route inventory freshness check
        run: python tools/export_admin_api_route_inventory.py --check

      - name: Admin API deploy smoke
        run: python -m pytest tests/regression/test_admin_api_local_run_contract.py -v --tb=short

      - name: Admin API controlled-live MVP route smoke
        run: python tools/run_admin_api_controlled_live_mvp_smoke.py --summary-output artifacts/coinbase-backend-controlled-live-mvp-smoke-timing.json

      - name: Admin API OIDC readiness smoke
        run: python tools/run_admin_oidc_readiness_smoke.py --summary-only

      - name: Write backend deployment manifest
        run: python tools/write_admin_api_deployment_manifest.py --deployment-tier local

      - name: Compile backend packages
        run: |
          python -m compileall -q -b \
            api \
            application \
            bridges \
            business \
            calculation \
            core \
            data \
            database \
            external \
            integration \
            market_intel \
            websocket
          find \
            api \
            application \
            bridges \
            business \
            calculation \
            core \
            data \
            database \
            external \
            integration \
            market_intel \
            websocket \
            -name '*.pyc' \
            -delete

      - name: Package backend deploy payload
        run: |
          mkdir -p artifacts
          tar -czf artifacts/coinbase-backend-deployment.tgz \
            artifacts/coinbase-backend-deployment-manifest.json \
            artifacts/coinbase-backend-controlled-live-mvp-smoke-timing.json \
            api \
            application \
            bridges \
            business \
            calculation \
            core \
            data \
            database \
            external \
            integration \
            market_intel \
            websocket \
            openapi/coinbase-admin-api.yaml \
            openapi/coinbase-admin-api-route-inventory.json \
            tools/write_admin_api_deployment_manifest.py \
            tools/apply_admin_api_local_deployment.py \
            tools/run_admin_api_controlled_live_mvp_smoke.py \
            tools/run_admin_api.py \
            tools/generate_admin_api_openapi.py \
            tools/export_admin_api_route_inventory.py \
            tools/run_admin_api_futures_live_fill_readback.py \
            tools/run_admin_api_manual_order_live_submit.py \
            tools/run_admin_api_usdc_pair_snapshot_live_readback.py \
            tools/coinbase_live_credentials.py \
            tools/run_spot_fill_backfill_recovery.py \
            tools/run_spot_sweep_recovery_gate.py \
            configuration.py \
            dashboard_server.py \
            logging_service.py \
            main.py \
            pyproject.toml \
            products.json \
            README.md \
            README.admin-api.md

      - name: Apply local backend deployment
        run: python tools/apply_admin_api_local_deployment.py

      - name: Confirm local no-live posture
        run: |
          echo 'Live Coinbase execution: not run; notional $0'

      - name: Upload deployment payload
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-backend-local-deployment
          path: |
            artifacts/coinbase-backend-deployment.tgz
            artifacts/coinbase-backend-deployment-manifest.json
            artifacts/coinbase-backend-controlled-live-mvp-smoke-timing.json
            artifacts/coinbase-backend-local-deployment-manifest.json
            coinbase-local/backend/current-release.json
