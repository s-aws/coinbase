[pytest]
# Pytest configuration for regression testing

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --basetemp=genai_tools/pytest-tmp/default

# Test paths
testpaths = tests

# Markers
markers =
    external: External API integration tests (requires credentials)
    slow: Slow running tests
    regression: Regression tests (must pass before deploy)
    integration: Integration tests that touch the real DB (auto-routed to port 9876)

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (seconds)
timeout = 30

# Minimum Python version
minversion = 3.9
