[pytest]
# Pytest configuration for regression testing

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --basetemp=genai_tools/pytest-tmp/default

# Test paths
testpaths = tests

# Markers
markers =
    external: External API integration tests (requires credentials)
    slow: Slow running tests
    regression: Regression tests for durable milestone closeout, release handoff, explicit request, or deployment approval
    integration: Integration tests that touch the real DB (auto-routed to port 9876)
    serial: Tests that must run in the serial regression lane because they touch shared DB tables, fixed ports/files, process-global state, or timing-sensitive concurrency

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (seconds)
timeout = 30

# Minimum Python version
minversion = 3.9
