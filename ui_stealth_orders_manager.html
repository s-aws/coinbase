<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Orders Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #444;
        }

        h1 {
            font-size: 28px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #999;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Table Styles */
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .orders-table thead {
            background: rgba(0, 0, 0, 0.3);
        }

        .orders-table th {
            padding: 12px;
            text-align: left;
            color: #aaa;
            font-weight: 600;
            border-bottom: 2px solid #444;
        }

        .orders-table td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        .orders-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }

        .status-hidden {
            background: rgba(100, 100, 150, 0.3);
            color: #7ba3ff;
        }

        .status-pending {
            background: rgba(150, 100, 50, 0.3);
            color: #ffb347;
        }

        .status-triggered {
            background: rgba(150, 50, 50, 0.3);
            color: #ff6b6b;
        }

        .status-revealed {
            background: rgba(50, 150, 100, 0.3);
            color: #51cf66;
        }

        .status-executed {
            background: rgba(50, 100, 150, 0.3);
            color: #74c0fc;
        }

        .status-cancelled {
            background: rgba(100, 100, 100, 0.3);
            color: #999;
        }

        .side-buy {
            color: #51cf66;
        }

        .side-sell {
            color: #ff6b6b;
        }

        .condition-type {
            background: rgba(100, 100, 150, 0.2);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #74c0fc);
            transition: width 0.3s ease;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        button {
            padding: 6px 10px;
            border: 1px solid #555;
            background: rgba(100, 100, 100, 0.2);
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(100, 100, 100, 0.4);
            border-color: #777;
        }

        button.cancel-btn {
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        button.cancel-btn:hover {
            background: rgba(255, 107, 107, 0.1);
        }

        /* Form Styles */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
            font-weight: 600;
        }

        input, select, textarea {
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #555;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 12px;
            font-family: inherit;
        }

        option {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .create-btn {
            padding: 10px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #000;
            border: none;
            font-weight: 600;
            margin-top: 10px;
        }

        .create-btn:hover {
            background: linear-gradient(135deg, #51cf66, #16a34a);
        }

        .create-btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
        }

        /* Advanced Condition Section */
        .condition-fields {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .condition-field {
            margin-bottom: 8px;
        }

        .condition-field:last-child {
            margin-bottom: 0;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state p {
            margin-bottom: 10px;
        }

        /* Messages */
        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .message.info {
            background: rgba(119, 163, 255, 0.1);
            border: 1px solid rgba(119, 163, 255, 0.3);
            color: #7ba3ff;
        }

        .refresh-indicator {
            font-size: 11px;
            color: #666;
        }

        .right-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .content {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            .stats {
                width: 100%;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <span class="status-indicator"></span>
                Stealth Orders Manager
            </h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">Active Orders</span>
                    <span class="stat-value" id="stat-active">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Total Size</span>
                    <span class="stat-value" id="stat-size">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Executed</span>
                    <span class="stat-value" id="stat-executed">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Connection</span>
                    <span class="stat-value" id="connection-status" style="color: #ff6b6b;">●</span>
                </div>
            </div>
        </header>

        <div class="content">
            <div class="section" style="grid-column: 1;">
                <h2>📊 Active Stealth Orders</h2>
                <div class="message" id="message-container"></div>
                <div style="overflow-x: auto;">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Side</th>
                                <th>Size</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Condition</th>
                                <th>Progress</th>
                                <th>Executed</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <tr>
                                <td colspan="9" style="text-align: center; padding: 30px; color: #666;">
                                    Loading orders...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 15px; font-size: 11px; color: #666; text-align: right;">
                    <span class="refresh-indicator">Auto-refresh: <span id="refresh-timer">30</span>s</span>
                </div>
            </div>

            <div class="right-sidebar">
                <!-- Create Order Section -->
                <div class="section">
                    <h2>➕ Create New Order</h2>
                    <form id="create-order-form" class="form-section">
                        <div class="form-group">
                            <label>Product ID *</label>
                            <select id="product_id" required>
                                <option value="">Select Product...</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Side *</label>
                                <select id="side" required>
                                    <option value="">Select...</option>
                                    <option value="BUY" selected>BUY</option>
                                    <option value="SELL">SELL</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Size *</label>
                                <input type="number" id="total_size" placeholder="0.00000001" step="0.00000001" value="1.0" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Limit Price *</label>
                            <input type="number" id="limit_price" placeholder="0.00" step="0.01" value="0.00" required>
                        </div>

                        <div class="form-group">
                            <label>Reveal Condition *</label>
                            <select id="condition_type" required>
                                <option value="">Select...</option>
                                <option value="time_delay" selected>Time Delay</option>
                                <option value="price">Price Threshold</option>
                                <option value="cumulative_volume">Volume Threshold</option>
                                <option value="spread">Spread Trigger</option>
                                <option value="product_ratio">Product Ratio</option>
                            </select>
                        </div>

                        <!-- Condition-specific fields -->
                        <div class="condition-fields" id="condition-fields-container"></div>

                        <div class="form-group">
                            <label>Sizing Strategy</label>
                            <select id="sizing_strategy" onchange="updateSizingFields()">
                                <option value="fixed">Fixed (All at once)</option>
                                <option value="adaptive">Adaptive (Volume-based)</option>
                                <option value="tranche">Tranche (Staged)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Reason / Notes</label>
                            <textarea id="notes" placeholder="Optional notes about this order"></textarea>
                        </div>

                        <button type="submit" class="create-btn">Create Stealth Order</button>
                    </form>
                </div>

                <!-- Quick Stats -->
                <div class="section">
                    <h2>📈 Quick Stats</h2>
                    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 12px;">
                        <div style="padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px;">
                            <div style="color: #aaa; margin-bottom: 4px;">Hidden Orders</div>
                            <div style="font-size: 16px; font-weight: bold; color: #7ba3ff;" id="count-hidden">0</div>
                        </div>
                        <div style="padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px;">
                            <div style="color: #aaa; margin-bottom: 4px;">Triggered Orders</div>
                            <div style="font-size: 16px; font-weight: bold; color: #ff6b6b;" id="count-triggered">0</div>
                        </div>
                        <div style="padding: 8px; background: rgba(0,0,0,0.2); border-radius: 4px;">
                            <div style="color: #aaa; margin-bottom: 4px;">Revealed Orders</div>
                            <div style="font-size: 16px; font-weight: bold; color: #51cf66;" id="count-revealed">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = `ws://${window.location.hostname || 'localhost'}:8765`;
        let ws = null;
        let ordersData = {};
        let orderedProducts = [];
        let allProducts = [];  // All available products from JSON
        let productMetadata = {};  // Product metadata (base_increment, etc.)
        let refreshInterval = null;
        let refreshCountdown = 30;

        // Condition field templates
        const conditionTemplates = {
            price: `
                <div class="condition-field">
                    <label>Price Threshold *</label>
                    <input type="number" name="price_threshold" placeholder="0.00" step="0.01" required>
                </div>
                <div class="condition-field">
                    <label>Direction *</label>
                    <select name="direction" required>
                        <option value="">Select...</option>
                        <option value="below">Below (buy)</option>
                        <option value="above">Above (sell)</option>
                    </select>
                </div>
                <div class="condition-field">
                    <label>Hold Duration (sec) *</label>
                    <input type="number" name="hold_duration_seconds" placeholder="2" step="1" min="1" required>
                </div>
            `,
            cumulative_volume: `
                <div class="condition-field">
                    <label>Price Level *</label>
                    <input type="number" name="price_level" placeholder="0.00" step="0.01" required>
                </div>
                <div class="condition-field">
                    <label>Volume Threshold *</label>
                    <input type="number" name="volume_threshold" placeholder="0.0" step="0.01" required>
                </div>
                <div class="condition-field">
                    <label>Lookback (sec) *</label>
                    <input type="number" name="lookback_seconds" placeholder="30" step="1" min="1" required>
                </div>
            `,
            time_delay: `
                <div class="condition-field">
                    <label>Delay (sec) *</label>
                    <input type="number" name="delay_seconds" placeholder="60" step="1" min="1" required>
                </div>
                <div class="condition-field">
                    <label>Jitter (sec) *</label>
                    <input type="number" name="jitter_seconds" placeholder="30" step="1" min="0" required>
                </div>
            `,
            spread: `
                <div class="condition-field">
                    <label>Max Spread *</label>
                    <input type="number" name="max_spread" placeholder="2.00" step="0.01" required>
                </div>
                <div class="condition-field">
                    <label>Hold Duration (sec) *</label>
                    <input type="number" name="hold_duration_seconds" placeholder="1" step="1" min="1" required>
                </div>
            `,
            product_ratio: `
                <div class="condition-field">
                    <label>Product A *</label>
                    <input type="text" name="product_a" placeholder="e.g., BIT-24APR26-CDE" required>
                </div>
                <div class="condition-field">
                    <label>Product B *</label>
                    <input type="text" name="product_b" placeholder="e.g., BIP-20DEC30-CDE" required>
                </div>
                <div class="condition-field">
                    <label>Ratio Threshold *</label>
                    <input type="number" name="ratio_threshold" placeholder="0.99" step="0.001" required>
                </div>
                <div class="condition-field">
                    <label>Direction *</label>
                    <select name="direction" required>
                        <option value="">Select...</option>
                        <option value="below">Below</option>
                        <option value="above">Above</option>
                    </select>
                </div>
            `
        };

        function initWebSocket() {
            try {
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    console.log("Connected to dashboard server");
                    updateConnectionStatus(true);
                    // Request initial data
                    ws.send(JSON.stringify({
                        type: "request_stealth_orders"
                    }));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === "products_list") {
                        // Receive products from WebSocket on initial connection
                        allProducts = [...(data.derivatives || []), ...(data.spot || [])].sort();
                        productMetadata = data.metadata || {};  // Store metadata
                        updateProductDropdown();
                        addProductChangeListener();  // Add event listener for product selection
                        console.log(`Loaded ${allProducts.length} products from WebSocket`);
                    } else if (data.type === "stealth_orders_snapshot") {
                        ordersData = data.orders || {};
                        updateOrdersTable();
                        updateStats();
                    } else if (data.type === "stealth_order_created") {
                        showMessage(`Order created: ${data.stealth_order_id}`, 'success');
                        ordersData[data.stealth_order_id] = data.order;
                        updateOrdersTable();
                        updateStats();
                    } else if (data.type === "stealth_order_updated") {
                        ordersData[data.stealth_order_id] = data.order;
                        updateOrdersTable();
                        updateStats();
                    }
                };

                ws.onclose = () => {
                    console.log("Disconnected from dashboard server");
                    updateConnectionStatus(false);
                    // Attempt reconnect after 3 seconds
                    setTimeout(initWebSocket, 3000);
                };

                ws.onerror = (error) => {
                    console.error("WebSocket error:", error);
                    updateConnectionStatus(false);
                };
            } catch (error) {
                console.error("Failed to connect:", error);
                updateConnectionStatus(false);
            }
        }

        function loadProductsFromJSON() {
            // Products are now loaded from WebSocket on connection
            // This function is kept as fallback for manual loading
            fetch('products.json')
                .then(response => response.json())
                .then(data => {
                    allProducts = [...data.derivatives, ...data.spot].sort();
                    updateProductDropdown();
                    console.log(`Loaded ${allProducts.length} products from products.json`);
                })
                .catch(error => {
                    console.warn("Could not load products.json via fetch, products will load from WebSocket", error);
                    // Products will be loaded from WebSocket
                });
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connection-status');
            if (connected) {
                status.textContent = '●';
                status.style.color = '#4ade80';
            } else {
                status.textContent = '●';
                status.style.color = '#ff6b6b';
            }
        }

        function updateProductDropdown() {
            // Use all products from JSON if loaded, otherwise extract from active orders
            let products = allProducts.length > 0 
                ? allProducts
                : Array.from(new Set(Object.values(ordersData).map(o => o.product_id))).sort();
            
            orderedProducts = products;
            
            const select = document.getElementById('product_id');
            const currentValue = select.value;
            
            // Rebuild options
            let options = '<option value="">Select Product...</option>';
            products.forEach(product => {
                options += `<option value="${product}">${product}</option>`;
            });
            
            select.innerHTML = options;
            if (currentValue && products.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        function formatDecimal(num) {
            // Convert scientific notation to decimal format
            // e.g., 1e-8 becomes "0.00000001"
            if (typeof num === 'string') {
                num = parseFloat(num);
            }
            
            if (num === 0) return '0';
            
            const str = num.toString();
            
            if (str.includes('e') || str.includes('E')) {
                // Handle scientific notation
                let sign = '';
                let workingStr = str;
                
                if (workingStr[0] === '-') {
                    sign = '-';
                    workingStr = workingStr.slice(1);
                }
                
                const parts = workingStr.split(/[eE]/);
                const mantissa = parseFloat(parts[0]);
                const exponent = parseInt(parts[1], 10);
                
                let result;
                if (exponent < 0) {
                    // Small number like 1e-8
                    result = '0.' + '0'.repeat(Math.abs(exponent) - 1) + mantissa.toString().replace('.', '');
                } else {
                    // Large number like 1e10
                    result = (mantissa * Math.pow(10, exponent)).toString();
                }
                
                return sign + result;
            }
            
            return str;
        }

        function addProductChangeListener() {
            const productSelect = document.getElementById('product_id');
            productSelect.addEventListener('change', (e) => {
                const selectedProduct = e.target.value;
                
                if (selectedProduct && productMetadata[selectedProduct]) {
                    // Get the base_increment (minimum size) for this product
                    const metadata = productMetadata[selectedProduct];
                    const minSizeValue = metadata.base_increment;
                    
                    // Format the size without scientific notation
                    const formattedSize = formatDecimal(minSizeValue);
                    
                    // Update the size field with the minimum size
                    document.getElementById('total_size').value = formattedSize;
                }
            });
        }

        function updateOrdersTable() {
            const tbody = document.getElementById('orders-tbody');
            const orders = Object.values(ordersData);
            
            // Update product dropdown with any new products
            updateProductDropdown();

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 30px; color: #666;">
                            No active stealth orders
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = orders.map(order => {
                const executedPct = order.total_size > 0 
                    ? Math.round((order.executed_size / order.total_size) * 100)
                    : 0;
                
                // Format size with appropriate decimals for micro quantities
                const sizeStr = parseFloat(order.total_size) < 0.01 
                    ? parseFloat(order.total_size).toFixed(8)
                    : parseFloat(order.total_size).toFixed(2);
                const executedStr = parseFloat(order.executed_size) < 0.01
                    ? parseFloat(order.executed_size).toFixed(8)
                    : parseFloat(order.executed_size).toFixed(2);

                return `
                    <tr>
                        <td><strong>${order.product_id}</strong></td>
                        <td class="side-${order.side.toLowerCase()}">${order.side}</td>
                        <td>${sizeStr}</td>
                        <td>${parseFloat(order.limit_price).toFixed(2)}</td>
                        <td><span class="status-badge status-${order.status.toLowerCase()}">${order.status}</span></td>
                        <td><span class="condition-type">${order.reveal_condition?.type || 'N/A'}</span></td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${executedPct}%"></div>
                            </div>
                            <div style="font-size: 10px; color: #999; margin-top: 2px;">${executedPct}%</div>
                        </td>
                        <td>${executedStr}</td>
                        <td>
                            <div class="action-buttons">
                                ${['HIDDEN', 'PENDING', 'TRIGGERED'].includes(order.status) 
                                    ? `<button onclick="cancelOrder('${order.stealth_order_id}')" class="cancel-btn">Cancel</button>`
                                    : `<span style="color: #999; font-size: 12px;">${order.status === 'REVEALED' ? 'Revealed' : order.status === 'EXECUTED' ? 'Executed' : order.status}</span>`
                                }
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats() {
            const orders = Object.values(ordersData);
            const active = orders.filter(o => ['HIDDEN', 'PENDING', 'TRIGGERED', 'REVEALED'].includes(o.status));
            const totalSize = active.reduce((sum, o) => sum + parseFloat(o.total_size || 0), 0);
            const executed = active.reduce((sum, o) => sum + parseFloat(o.executed_size || 0), 0);

            document.getElementById('stat-active').textContent = active.length;
            document.getElementById('stat-size').textContent = totalSize < 0.01 ? totalSize.toFixed(8) : totalSize.toFixed(2);
            document.getElementById('stat-executed').textContent = executed < 0.01 ? executed.toFixed(8) : executed.toFixed(2);

            // Count by status
            const hidden = orders.filter(o => o.status === 'HIDDEN').length;
            const triggered = orders.filter(o => o.status === 'TRIGGERED').length;
            const revealed = orders.filter(o => o.status === 'REVEALED').length;

            document.getElementById('count-hidden').textContent = hidden;
            document.getElementById('count-triggered').textContent = triggered;
            document.getElementById('count-revealed').textContent = revealed;
        }

        function updateConditionFields() {
            const conditionType = document.getElementById('condition_type').value;
            const container = document.getElementById('condition-fields-container');
            
            if (conditionTemplates[conditionType]) {
                container.innerHTML = conditionTemplates[conditionType];
            } else {
                container.innerHTML = '';
            }
        }

        function updateSizingFields() {
            // Could expand this for different sizing strategy options
        }

        function saveFormValues() {
            // Save all form values to localStorage
            const formData = {
                product_id: document.getElementById('product_id').value,
                side: document.getElementById('side').value,
                total_size: document.getElementById('total_size').value,
                limit_price: document.getElementById('limit_price').value,
                condition_type: document.getElementById('condition_type').value,
                sizing_strategy: document.getElementById('sizing_strategy').value,
                notes: document.getElementById('notes').value
            };
            
            // Also save any dynamic condition fields
            const conditionFieldsContainer = document.getElementById('condition-fields-container');
            if (conditionFieldsContainer) {
                const inputs = conditionFieldsContainer.querySelectorAll('input, select, textarea');
                inputs.forEach(input => {
                    if (input.name) {
                        formData[input.name] = input.value;
                    }
                });
            }
            
            localStorage.setItem('stealth_order_form_data', JSON.stringify(formData));
        }

        function restoreFormValues() {
            // Restore form values from localStorage
            const savedData = localStorage.getItem('stealth_order_form_data');
            
            if (savedData) {
                try {
                    const formData = JSON.parse(savedData);
                    
                    // Restore main fields
                    const mainFields = ['product_id', 'side', 'total_size', 'limit_price', 'condition_type', 'sizing_strategy', 'notes'];
                    mainFields.forEach(fieldId => {
                        const element = document.getElementById(fieldId);
                        if (element && formData[fieldId] !== undefined) {
                            element.value = formData[fieldId];
                        }
                    });
                    
                    // Restore condition-specific field values
                    setTimeout(() => {
                        const conditionFieldsContainer = document.getElementById('condition-fields-container');
                        if (conditionFieldsContainer) {
                            const inputs = conditionFieldsContainer.querySelectorAll('input, select, textarea');
                            inputs.forEach(input => {
                                if (input.name && formData[input.name] !== undefined) {
                                    input.value = formData[input.name];
                                }
                            });
                        }
                    }, 100);
                    
                    console.log('Restored form values from localStorage');
                } catch (error) {
                    console.warn('Failed to restore form values:', error);
                }
            }
            
            // Always update condition fields based on current condition_type value
            // This ensures fields are shown on initial page load even if no data was restored
            updateConditionFields();
        }

        function buildRevealCondition() {
            const type = document.getElementById('condition_type').value;
            const fields = document.querySelectorAll('[name]');
            const condition = { type };

            fields.forEach(field => {
                if (field.name && field.value) {
                    const value = field.type === 'number' ? parseFloat(field.value) : field.value;
                    condition[field.name] = value;
                }
            });

            return condition;
        }

        document.getElementById('condition_type').addEventListener('change', updateConditionFields);

        document.getElementById('create-order-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const order = {
                product_id: document.getElementById('product_id').value,
                side: document.getElementById('side').value,
                total_size: parseFloat(document.getElementById('total_size').value),
                limit_price: parseFloat(document.getElementById('limit_price').value),
                reveal_condition: buildRevealCondition(),
                sizing_strategy: {
                    type: document.getElementById('sizing_strategy').value
                },
                notes: document.getElementById('notes').value
            };

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showMessage('Not connected to server', 'error');
                return;
            }

            try {
                ws.send(JSON.stringify({
                    type: "create_stealth_order",
                    order: order
                }));

                // Save form values for next order
                saveFormValues();
                showMessage('Order creation request sent', 'info');
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        });

        function cancelOrder(orderID) {
            if (!confirm(`Cancel order ${orderID}?`)) {
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showMessage('Not connected to server', 'error');
                return;
            }

            ws.send(JSON.stringify({
                type: "cancel_stealth_order",
                stealth_order_id: orderID
            }));
        }

        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            container.textContent = text;
            container.className = `message ${type} show`;
            
            setTimeout(() => {
                container.classList.remove('show');
            }, 5000);
        }

        function startRefreshTimer() {
            refreshCountdown = 30;
            if (refreshInterval) clearInterval(refreshInterval);
            
            refreshInterval = setInterval(() => {
                refreshCountdown--;
                document.getElementById('refresh-timer').textContent = refreshCountdown;
                
                if (refreshCountdown <= 0) {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: "request_stealth_orders"
                        }));
                    }
                    refreshCountdown = 30;
                }
            }, 1000);
        }

        // Initialize
        loadProductsFromJSON();  // Load all products at startup
        restoreFormValues();      // Restore last used form values
        initWebSocket();
        startRefreshTimer();
    </script>
</body>
</html>
