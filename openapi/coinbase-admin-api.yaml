openapi: 3.1.0
info:
  title: Coinbase Admin API
  description: Enterprise API for the Coinbase trading engine. Read-only operator
    routes are active; mutating HTTP routes use shared command services but remain
    live-disabled by the approval gate.
  version: 0.1.0
paths:
  /api/v1/admin/bootstrap:
    get:
      tags:
      - admin
      summary: Read backend association and live-action posture
      operationId: admin_bootstrap_api_v1_admin_bootstrap_get
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Admin-Actor
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Actor
        description: Required only for COINBASE_ADMIN_API_AUTH_MODE=bootstrap_bearer.
          Ignored in oidc_jwt mode because actor identity is derived from verified
          JWT claims.
      - name: X-Admin-Roles
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Roles
        description: Required only for COINBASE_ADMIN_API_AUTH_MODE=bootstrap_bearer.
          Ignored in oidc_jwt mode because role evidence is derived from verified
          JWT claims.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBootstrapResponse'
        '401':
          description: Missing or invalid Admin API authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiErrorResponse'
        '403':
          description: Actor lacks the required Admin API permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
