components:
  schemas:
    ActionConditionType:
      type: string
      enum:
      - wallet_available
      - planned_budget_available
      - known_inventory_available
      - manual_live_acknowledgement
      - direct_spot_cap_required
      - durable_audit_available
      - max_base_size
      - max_notional
      title: ActionConditionType
      description: Built-in action-condition guard types.
    ActionGuardPhase:
      type: string
      enum:
      - planning
      - reveal
      title: ActionGuardPhase
      description: Action-condition guard evaluation phase.
    AdminAdmissionAuditCreateRequest:
      properties:
        route:
          type: string
          minLength: 1
          title: Route
        method:
          type: string
          minLength: 1
          title: Method
        module_id:
          type: string
          minLength: 1
          title: Module Id
        identity_key:
          type: string
          minLength: 1
          title: Identity Key
        identity_value:
          type: string
          minLength: 1
          title: Identity Value
        action_class:
          $ref: '#/components/schemas/AdminApiActionClass'
        required_permission:
          anyOf:
          - $ref: '#/components/schemas/AdminApiPermission'
          - type: string
          title: Required Permission
        service_method:
          type: string
          minLength: 1
          title: Service Method
        actor_id:
          type: string
          minLength: 1
          title: Actor Id
        operator_intent:
          type: string
          minLength: 1
          title: Operator Intent
        command_idempotency_key:
          type: string
          minLength: 1
          title: Command Idempotency Key
        payload_hash:
          type: string
          maxLength: 64
          minLength: 64
          title: Payload Hash
        approval_snapshot_id:
          type: string
          minLength: 1
          title: Approval Snapshot Id
        approval_snapshot_approved_by_actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Approval Snapshot Approved By Actor Id
        approval_snapshot_requested_by_actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Approval Snapshot Requested By Actor Id
        approval_snapshot_expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Approval Snapshot Expires At
