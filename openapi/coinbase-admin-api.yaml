                $ref: '#/components/schemas/AdminApiCommandResponse'
        '501':
          description: Live HTTP execution is not implemented for this command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
