      - admin
      summary: Read backend association and live-action posture
      operationId: admin_bootstrap_api_v1_admin_bootstrap_get
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Admin-Actor
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Actor
      - name: X-Admin-Roles
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Roles
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBootstrapResponse'
        '401':
          description: Missing or invalid Admin API authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiErrorResponse'
        '403':
          description: Actor lacks the required Admin API permission.
