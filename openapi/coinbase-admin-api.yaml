components:
  schemas:
    AdminApiActionClass:
      type: string
      enum:
      - read_only
      - local_state_mutation
      - live_exchange_place
      - live_exchange_cancel
      - admin_runtime
      - audit
      title: AdminApiActionClass
      description: Enterprise Admin API route risk/action classification.
    AdminApiCommandResponse:
      properties:
        status:
          $ref: '#/components/schemas/AdminApiCommandStatus'
        action_class:
          $ref: '#/components/schemas/AdminApiActionClass'
        required_permission:
          $ref: '#/components/schemas/AdminApiPermission'
        service_method:
          type: string
          title: Service Method
        message:
          type: string
          title: Message
        client_order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Order Id
        coinbase_order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Coinbase Order Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
        audit_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Id
        live_exchange_submitted:
          type: boolean
          title: Live Exchange Submitted
          default: false
        submission_event_recorded:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Submission Event Recorded
        audit_command:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Command
        guard:
          anyOf:
          - type: object
          - type: 'null'
          title: Guard
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
        failure_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Stage
      additionalProperties: false
      type: object
      required:
      - status
      - action_class
      - required_permission
      - service_method
      - message
      title: AdminApiCommandResponse
      description: Typed response returned by Admin API command adapters.
    AdminApiCommandStatus:
      type: string
      enum:
      - accepted
      - rejected
      - not_implemented
      - replayed
      - conflict
      title: AdminApiCommandStatus
      description: Admin API command status values returned to operators.
    AdminApiPermission:
      type: string
      enum:
      - analytics:read
      - audit:read
      - order:create
      - order:cancel
      - campaign:read
      - campaign:execute
      - config:update
      - runtime:pause
      - runtime:resume
      - runtime:shutdown
      title: AdminApiPermission
      description: Backend-enforced Admin API permission names.
    CancelOrderRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      title: CancelOrderRequest
      description: Cancel request body keyed by path ``client_order_id``.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ManualOrderRequest:
      properties:
        product_id:
          type: string
          minLength: 1
          title: Product Id
          examples:
          - BTC-USDC
        side:
          $ref: '#/components/schemas/OrderSide'
        order_type:
          $ref: '#/components/schemas/OrderType'
        base_size:
          anyOf:
          - type: string
            pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            description: Decimal value serialized as a string; floats are not part
              of the API contract.
            examples:
            - '1.00'
          - type: 'null'
          title: Base Size
        quote_size:
          anyOf:
          - type: string
            pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            description: Decimal value serialized as a string; floats are not part
              of the API contract.
            examples:
            - '1.00'
          - type: 'null'
          title: Quote Size
        limit_price:
          anyOf:
          - type: string
            pattern: ^-?(0|[1-9]\d*)(\.\d+)?$
            description: Decimal value serialized as a string; floats are not part
              of the API contract.
            examples:
            - '1.00'
          - type: 'null'
          title: Limit Price
        post_only:
          type: boolean
          title: Post Only
          default: false
        time_in_force:
          anyOf:
          - $ref: '#/components/schemas/TimeInForce'
          - type: 'null'
        manual_live_acknowledgement:
          type: boolean
          title: Manual Live Acknowledgement
          default: false
      additionalProperties: false
      type: object
      required:
      - product_id
      - side
      - order_type
      title: ManualOrderRequest
      description: Manual order request shape for future enterprise placement.
    OrderSide:
      type: string
      enum:
      - BUY
      - SELL
      title: OrderSide
      description: Direction of an order - BUY or SELL.
    OrderType:
      type: string
      enum:
      - LIMIT
      - MARKET
      - STOP_LIMIT
      title: OrderType
      description: 'Type of order - how it executes.


        From Coinbase API: LIMIT, MARKET, STOP_LIMIT'
    TimeInForce:
      type: string
      enum:
      - GOOD_UNTIL_CANCELLED
      - IMMEDIATE_OR_CANCEL
      - FILL_OR_KILL
      - GOOD_UNTIL_DATE_TIME
      - GOOD_UNTIL_CANCELLED
      - IMMEDIATE_OR_CANCEL
      - FILL_OR_KILL
      - GOOD_UNTIL_DATE_TIME
      title: TimeInForce
      description: 'How long an order remains valid.


        - GTC (GOOD_UNTIL_CANCELLED): Order stays until filled or manually cancelled

        - IOC (IMMEDIATE_OR_CANCEL): Fill entire order immediately or cancel

        - FOK (FILL_OR_KILL): Fill entire order immediately or cancel (no partial)

        - GTD (GOOD_UNTIL_DATE_TIME): Order expires at specified end_time'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
