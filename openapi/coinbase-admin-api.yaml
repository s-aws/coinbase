openapi: 3.1.0
info:
  title: Coinbase Admin API
  description: Enterprise API for the Coinbase trading engine. Read-only operator
    routes are active; mutating HTTP routes use shared command services but remain
    live-disabled by the approval gate.
  version: 0.1.0
paths:
  /api/v1/orders:
    post:
      tags:
      - orders
      summary: Create a manual order through the shared command service
      description: 'Route adapter for manual placement.


        The route is authenticated, idempotent, audited, and still live-disabled

        until enterprise approval/cap gates are completed.'
      operationId: create_manual_order_api_v1_orders_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: Idempotency-Key
      - name: X-Correlation-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: X-Correlation-Id
      - name: X-Operator-Intent
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: X-Operator-Intent
      - name: Authorization
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Admin-Actor
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Actor
      - name: X-Admin-Roles
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualOrderRequest'
      responses:
        '501':
          description: Live HTTP execution is not implemented for this command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '400':
          description: Command rejected before live exchange execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '401':
          description: Missing or invalid Admin API authentication.
        '403':
          description: Actor lacks the required Admin API permission.
        '409':
          description: Idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/orders/{client_order_id}/cancel:
    post:
      tags:
      - orders
      summary: Cancel an order by client_order_id through the shared command service
      description: Route adapter for cancel-by-client-order-id.
      operationId: cancel_order_by_client_order_id_api_v1_orders__client_order_id__cancel_post
      parameters:
      - name: client_order_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          title: Client Order Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: Idempotency-Key
      - name: X-Correlation-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: X-Correlation-Id
      - name: X-Operator-Intent
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          title: X-Operator-Intent
      - name: Authorization
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Admin-Actor
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Actor
      - name: X-Admin-Roles
        in: header
        required: true
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '501':
          description: Live HTTP execution is not implemented for this command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '400':
          description: Command rejected before live exchange execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '401':
          description: Missing or invalid Admin API authentication.
        '403':
          description: Actor lacks the required Admin API permission.
        '409':
          description: Idempotency key conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiCommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
