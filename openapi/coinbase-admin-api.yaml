components:
  schemas:
    AdminApiActionClass:
      type: string
      enum:
      - read_only
      - local_state_mutation
      - live_exchange_place
      - live_exchange_cancel
      - admin_runtime
      - audit
      title: AdminApiActionClass
      description: Enterprise Admin API route risk/action classification.
    AdminApiActor:
      properties:
        actor_id:
          type: string
          minLength: 1
          title: Actor Id
        roles:
          items:
            $ref: '#/components/schemas/AdminApiRole'
          type: array
          title: Roles
      additionalProperties: false
      type: object
      required:
      - actor_id
      title: AdminApiActor
      description: Authenticated actor evidence supplied by future auth middleware.
    AdminApiCommandResponse:
      properties:
        status:
          $ref: '#/components/schemas/AdminApiCommandStatus'
        action_class:
          $ref: '#/components/schemas/AdminApiActionClass'
        required_permission:
          $ref: '#/components/schemas/AdminApiPermission'
        service_method:
          type: string
          title: Service Method
        message:
          type: string
          title: Message
        client_order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Order Id
        coinbase_order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Coinbase Order Id
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        idempotency_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency Key
        audit_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Id
        live_exchange_submitted:
          type: boolean
          title: Live Exchange Submitted
          default: false
        submission_event_recorded:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Submission Event Recorded
        audit_command:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Command
        guard:
          anyOf:
          - type: object
          - type: 'null'
          title: Guard
        data:
          anyOf:
          - {}
          - type: 'null'
          title: Data
        failure_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Stage
      additionalProperties: false
      type: object
      required:
      - status
      - action_class
      - required_permission
      - service_method
      - message
      title: AdminApiCommandResponse
      description: Typed response returned by Admin API command adapters.
    AdminApiCommandStatus:
      type: string
      enum:
      - accepted
      - rejected
      - not_implemented
      - replayed
      - conflict
      title: AdminApiCommandStatus
      description: Admin API command status values returned to operators.
    AdminApiErrorCode:
      type: string
      enum:
      - auth_required
      - permission_denied
      - validation_error
      - idempotency_conflict
      - guard_blocked
      - not_implemented
      - backend_unavailable
      - request_error
      title: AdminApiErrorCode
      description: Structured Admin API error codes exposed to the frontend.
    AdminApiErrorResponse:
      properties:
        code:
          $ref: '#/components/schemas/AdminApiErrorCode'
        message:
          type: string
          title: Message
        severity:
          $ref: '#/components/schemas/AdminApiErrorSeverity'
        guard_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Guard Name
        field_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Field Path
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
        audit_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Audit Id
        live_coinbase_orders_ran:
          type: boolean
          title: Live Coinbase Orders Ran
          default: false
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - severity
      title: AdminApiErrorResponse
      description: Structured error body shared by Admin API routes.
    AdminApiErrorSeverity:
      type: string
      enum:
      - info
      - warning
      - error
      - critical
      title: AdminApiErrorSeverity
      description: Operator-facing severity for structured Admin API errors.
    AdminApiGateStatus:
      type: string
      enum:
      - passed
      - warning
      - blocked
      - not_applicable
      title: AdminApiGateStatus
      description: Release and recovery gate status exposed by read-only Admin API
        routes.
    AdminApiHealthStatus:
      type: string
      enum:
      - healthy
      - degraded
      - blocked
      title: AdminApiHealthStatus
      description: Admin API health/readiness state.
    AdminApiPermission:
      type: string
      enum:
      - analytics:read
      - audit:read
      - order:create
      - order:cancel
      - campaign:read
      - campaign:execute
      - config:update
      - runtime:pause
      - runtime:resume
      - runtime:shutdown
      title: AdminApiPermission
      description: Backend-enforced Admin API permission names.
    AdminApiRole:
