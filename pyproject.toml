# Project metadata so `pip install -e .` makes every top-level package
# (bridges, business, calculation, core, data, database, external,
# integration, websocket) importable from any working directory and
# any Python invocation. After install, no PYTHONPATH or sys.path
# bootstrap is needed.
#
# Install (one-time, from repo root):
#     py -3.13 -m pip install -e .
#     python3.13 -m pip install -e .[test]
#
# Verify:
#     py -3.13 -c "from database.database import PostgresDB; print(PostgresDB)"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinbase-engine"
version = "0.1.0"
description = "Coinbase Advanced Trading engine: stealth orders, fills, lifecycle controller."
requires-python = ">=3.13"
# Keep deploy/runtime dependencies broad here. Add a lockfile only if the
# deployment target starts consuming one.
dependencies = [
    "coinbase-advanced-py>=1.8,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "psycopg2-binary>=2.9,<3",
    "PyJWT[crypto]>=2.12,<3",
    "PyYAML>=6,<7",
    "truststore>=0.10.4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.6,<4",
]

[tool.setuptools]
# Explicit list. Avoids accidentally scooping `tests/`, `genai_tools/`,
# top-level `__pycache__`, etc. as importable packages.
packages = [
    "api",
    "api.v1",
    "api.v1.routes",
    "application",
    "application.admin_api",
    "bridges",
    "business",
    "calculation",
    "core",
    "data",
    "database",
    "external",
    "integration",
    "market_intel",
    "websocket",
    "tools",
]

# `database` and `websocket` lack __init__.py today; declare them as
# namespace packages so setuptools includes them anyway.
[tool.setuptools.package-dir]
"" = "."
